<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">AIFactoryBox gateway, security and composable flows architecture</title>
<desc id="desc">Clients and Python Flows reach Nginx public ingress with a Bearer key validated via LiteLLM. Open WebUI calls LiteLLM internally. Presidio enforces pre-call chat PII masking and standalone document anonymization. LiteLLM routes model calls and forwards specialized and Knowledge Base requests to private FastAPI, backed by PostgreSQL pgvector.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10Z" fill="#60a5fa"/>
  </marker>
  <marker id="arrow-sec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10Z" fill="#34d399"/>
  </marker>
  <marker id="arrow-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10Z" fill="#fbbf24"/>
  </marker>
</defs>
<style>
  text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:16px;text-anchor:middle}
  .small{font-size:13px;fill:#cbd5e1}
  .sec-text{font-size:12px;fill:#6ee7b7;font-weight:600}
  .flow-text{font-size:12px;fill:#fde68a;font-weight:600}
  .heading{font-size:21px;font-weight:650}
  .box{fill:#172554;stroke:#60a5fa;stroke-width:1.5;rx:14}
  .private{fill:#0f172a;stroke:#64748b;stroke-width:1.5;rx:14}
  .sec-box{fill:#064e3b;stroke:#34d399;stroke-width:1.75;rx:14}
  .flow-box{fill:#451a03;stroke:#fbbf24;stroke-width:1.75;rx:14}
  .edge{fill:none;stroke:#60a5fa;stroke-width:2;marker-end:url(#arrow)}
  .sec-edge{fill:none;stroke:#34d399;stroke-width:2;stroke-dasharray:6 4;marker-end:url(#arrow-sec)}
  .flow-edge{fill:none;stroke:#fbbf24;stroke-width:2;marker-end:url(#arrow-flow)}
  .dashed{stroke-dasharray:6 5}
</style>
<rect width="1200" height="760" rx="18" fill="#080f20"/>
<text x="600" y="38" class="heading">Unified AI Gateway: Security Perimeter, Knowledge Base &amp; Composable Flows</text>

<!-- Security Perimeter Boundary -->
<rect x="225" y="65" width="950" height="535" rx="18" fill="none" stroke="#34d399" stroke-width="1.2" stroke-dasharray="8 6"/>
<text x="375" y="86" class="sec-text">PRIVATE DOCKER NETWORK (ai-gateway-net) — ZERO INTERNAL PORTS PUBLISHED</text>

<!-- Clients & Flows (Left) -->
<rect class="box" x="25" y="190" width="165" height="78"/>
<text x="107" y="222">Clients / Apps</text>
<text x="107" y="245" class="small">Bearer API key</text>

<rect class="flow-box" x="25" y="340" width="165" height="92"/>
<text x="107" y="370" fill="#fde68a" font-weight="650">Python Flows</text>
<text x="107" y="391" class="flow-text">flows/sdk.py &amp; CLI</text>
<text x="107" y="411" class="small">Safe Ingest · RAG · Voice</text>

<!-- Public Ingress: Nginx -->
<rect class="sec-box" x="245" y="255" width="170" height="105"/>
<text x="330" y="286" font-weight="650">Nginx Ingress</text>
<text x="330" y="307" class="sec-text">Port 80 · Auth Gate</text>
<text x="330" y="327" class="small">Key check via /v1/models</text>
<text x="330" y="345" class="small">Fail-closed 401/403</text>

<!-- LiteLLM Gateway -->
<rect class="box" x="480" y="255" width="205" height="105"/>
<text x="582" y="286" font-weight="650">LiteLLM Proxy</text>
<text x="582" y="307" class="small">Control Plane &amp; Router</text>
<text x="582" y="327" class="small">Quotas · Virtual Keys</text>
<text x="582" y="345" class="sec-text">Forwards Auth to RAG</text>

<!-- Open WebUI -->
<rect class="private" x="480" y="105" width="205" height="72"/>
<text x="582" y="136">Open WebUI</text>
<text x="582" y="159" class="small">Internal chat &amp; RAG UI</text>

<!-- Right Side Runtimes & Services -->
<rect class="private" x="875" y="105" width="280" height="72"/>
<text x="1015" y="135">Local Inference Runtimes</text>
<text x="1015" y="158" class="small">TEI Embeddings &amp; Reranker</text>

<rect class="private" x="875" y="220" width="280" height="72"/>
<text x="1015" y="250">Cloud LLM Providers</text>
<text x="1015" y="273" class="small">OpenAI (receives masked text)</text>

<rect class="private" x="875" y="340" width="280" height="82"/>
<text x="1015" y="370">FastAPI Orchestrator</text>
<text x="1015" y="391" class="small">OCR · Docs · Audio · Privacy</text>
<text x="1015" y="410" class="small">/v1/knowledge/* RAG APIs</text>

<rect class="private" x="875" y="485" width="280" height="82"/>
<text x="1015" y="513">Specialized Engines</text>
<text x="1015" y="534" class="small">Tesseract · Docling · Speaches</text>
<text x="1015" y="553" class="small">Piper TTS</text>

<!-- Bottom Security & Storage -->
<rect class="sec-box" x="480" y="485" width="205" height="82"/>
<text x="582" y="514" font-weight="650">Microsoft Presidio</text>
<text x="582" y="535" class="sec-text">Pre-call Chat PII Masking</text>
<text x="582" y="554" class="small">&amp; Standalone DLP API</text>

<rect class="private" x="245" y="485" width="170" height="82"/>
<text x="330" y="514" font-weight="650">PostgreSQL pgvector</text>
<text x="330" y="535" class="small">litellm_db (audit/keys)</text>
<text x="330" y="554" class="small">knowledge_db (auto-init)</text>

<!-- Edges -->
<path class="edge" d="M190 229H218V285H245"/>
<path class="flow-edge" d="M190 386H218V330H245"/>
<path class="edge" d="M415 307H480"/>
<path class="edge" d="M582 177V255"/>

<!-- LiteLLM to Right Services -->
<path class="edge" d="M685 280H770V141H875"/>
<path class="edge" d="M685 307H810V256H875"/>
<path class="edge" d="M685 334H770V381H875"/>
<text x="775" y="403" class="small">Pass-through</text>

<!-- Orchestrator to Engines, LiteLLM & pgvector -->
<path class="edge" d="M1015 422V485"/>
<path class="edge dashed" d="M875 398H740V526H415"/>
<text x="775" y="516" class="small">Vectors &amp; chunks</text>

<!-- Security & Audit Edges -->
<path class="sec-edge" d="M582 360V485"/>
<text x="658" y="438" class="sec-text">PII scan &amp; mask</text>
<path class="edge dashed" d="M515 360V445H330V485"/>
<text x="415" y="435" class="small">Audit &amp; spend</text>

<!-- Footer Legend -->
<text x="600" y="632" class="small">Security Layers: (1) Bearer key validation at Nginx ingress  (2) Pre-call PII masking on chat via Presidio  (3) Standalone DLP sanitization in flows/ingest-safe</text>
<text x="600" y="660" class="small">Composable Flows (flows/): Chain OCR/Docling → Presidio Anonymize → Knowledge Ingest (pgvector) → Reranked RAG &amp; TTS over the authenticated gateway.</text>
<text x="600" y="688" class="small">PostgreSQL (pgvector:pg15) automatically initializes knowledge_db and vector tables on first connection alongside litellm_db.</text>
</svg>