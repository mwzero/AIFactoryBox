# All specialized APIs use native pass-through. Auth is enforced at ingress
# via LiteLLM /v1/models; native pass-through auth requires Enterprise.
model_list:
- model_name: chat-small
  litellm_params:
    model: openai/gpt-4o-mini
    api_key: os.environ/OPENAI_API_KEY
- model_name: embedding-small
  litellm_params:
    model: openai/BAAI/bge-small-en-v1.5
    api_base: http://tei-embeddings:80/v1
    api_key: local
- model_name: rerank-small
  litellm_params:
    model: huggingface/cross-encoder/ms-marco-MiniLM-L-6-v2
    api_base: http://tei-rerank:80
    api_key: local
guardrails:
- guardrail_name: pii-before-model
  litellm_params:
    guardrail: presidio
    mode: pre_call
    default_on: true
    presidio_language: it
    presidio_analyzer_api_base: http://presidio-analyzer:3000
    presidio_anonymizer_api_base: http://presidio-anonymizer:3000
    pii_entities_config:
      PERSON: MASK
      EMAIL_ADDRESS: MASK
      PHONE_NUMBER: MASK
      CREDIT_CARD: MASK
      IBAN_CODE: MASK
    output_parse_pii: false
litellm_settings:
  request_timeout: 60
  num_retries: 2
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  pass_through_endpoints:
  - path: /v1/document/to-markdown
    target: http://orchestrator:8080/v1/document/to-markdown
    auth: false
    methods:
    - POST
    headers: {}
    forward_headers: false
    merge_query_params: true
  - path: /v1/privacy/anonymize
    target: http://orchestrator:8080/v1/privacy/anonymize
    auth: false
    methods:
    - POST
    headers: {}
    forward_headers: false
    merge_query_params: true
  - path: /v1/audio/transcribe
    target: http://orchestrator:8080/v1/audio/transcribe
    auth: false
    methods:
    - POST
    headers: {}
    forward_headers: false
    merge_query_params: true
  - path: /v1/audio/synthesize
    target: http://orchestrator:8080/v1/audio/synthesize
    auth: false
    methods:
    - POST
    headers: {}
    forward_headers: false
    merge_query_params: true
  - path: /v1/vision/ocr
    target: http://orchestrator:8080/v1/vision/ocr
    auth: false
    methods:
    - POST
    headers: {}
    forward_headers: false
    merge_query_params: true
  - path: /specialized/docs
    target: http://orchestrator:8080/docs
    auth: false
    methods:
    - GET
    headers: {}
  - path: /specialized/openapi.json
    target: http://orchestrator:8080/openapi.json
    auth: false
    methods:
    - GET
    headers: {}
  - path: /specialized/health
    target: http://orchestrator:8080/health
    auth: false
    methods:
    - GET
    headers: {}
