# Model APIs are owned by LiteLLM, not by the Python orchestrator.
model_list:
  - model_name: chat-small
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
  - model_name: embedding-small
    litellm_params:
      model: openai/BAAI/bge-small-en-v1.5
      api_base: http://tei-embeddings:80/v1
      api_key: local
  - model_name: rerank-small
    litellm_params:
      model: huggingface/cross-encoder/ms-marco-MiniLM-L-6-v2
      api_base: http://tei-rerank:80
      api_key: local

guardrails:
  - guardrail_name: pii-before-model
    litellm_params:
      guardrail: presidio
      mode: pre_call
      default_on: true
      presidio_language: it
      presidio_analyzer_api_base: http://presidio-analyzer:3000
      presidio_anonymizer_api_base: http://presidio-anonymizer:3000
      # Explicit entities enable fail-closed error handling in the pinned release.
      pii_entities_config:
        PERSON: MASK
        EMAIL_ADDRESS: MASK
        PHONE_NUMBER: MASK
        CREDIT_CARD: MASK
        IBAN_CODE: MASK
      output_parse_pii: false

litellm_settings:
  request_timeout: 60
  num_retries: 2

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
