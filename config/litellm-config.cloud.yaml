# Cloud / SaaS Inference Profile (OVH VPS + Groq + Hugging Face)
# Keeps Control Plane, Nginx Auth, Presidio PII Masking, pgvector KB & Console self-hosted,
# while delegating LLM, Whisper, Embeddings (1024-dim) and Reranking to Groq & Hugging Face.
model_list:
- model_name: chat-small
  litellm_params:
    model: groq/llama-3.3-70b-versatile
    api_key: os.environ/GROQ_API_KEY
- model_name: whisper-small
  litellm_params:
    model: groq/whisper-large-v3-turbo
    api_key: os.environ/GROQ_API_KEY
- model_name: embedding-small
  litellm_params:
    model: huggingface/BAAI/bge-m3
    api_key: os.environ/HUGGINGFACE_API_KEY
- model_name: rerank-small
  litellm_params:
    model: huggingface/BAAI/bge-reranker-v2-m3
    api_key: os.environ/HUGGINGFACE_API_KEY
guardrails:
- guardrail_name: pii-before-model
  litellm_params:
    guardrail: presidio
    mode: pre_call
    default_on: true
    presidio_language: it
    presidio_analyzer_api_base: http://presidio-analyzer:3000
    presidio_anonymizer_api_base: http://presidio-anonymizer:3000
    pii_entities_config:
      PERSON: MASK
      EMAIL_ADDRESS: MASK
      PHONE_NUMBER: MASK
      CREDIT_CARD: MASK
      IBAN_CODE: MASK
    output_parse_pii: false
litellm_settings:
  request_timeout: 60
  num_retries: 2
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  pass_through_endpoints:
  - path: /v1/document/to-markdown
    target: http://orchestrator:8080/v1/document/to-markdown
    auth: false
    methods:
    - POST
    headers: {}
    forward_headers: false
    merge_query_params: true
  - path: /v1/privacy/anonymize
    target: http://orchestrator:8080/v1/privacy/anonymize
    auth: false
    methods:
    - POST
    headers: {}
    forward_headers: false
    merge_query_params: true
  - path: /v1/audio/transcribe
    target: http://orchestrator:8080/v1/audio/transcribe
    auth: false
    methods:
    - POST
    headers: {}
    forward_headers: true
    merge_query_params: true
  - path: /v1/audio/synthesize
    target: http://orchestrator:8080/v1/audio/synthesize
    auth: false
    methods:
    - POST
    headers: {}
    forward_headers: false
    merge_query_params: true
  - path: /v1/vision/ocr
    target: http://orchestrator:8080/v1/vision/ocr
    auth: false
    methods:
    - POST
    headers: {}
    forward_headers: false
    merge_query_params: true
  - path: /v1/knowledge/collections
    target: http://orchestrator:8080/v1/knowledge/collections
    auth: false
    methods:
    - GET
    - POST
    headers: {}
    forward_headers: false
    merge_query_params: true
  - path: /v1/knowledge/collections/{collection_name}
    target: http://orchestrator:8080/v1/knowledge/collections/{collection_name}
    auth: false
    methods:
    - DELETE
    headers: {}
    forward_headers: false
    merge_query_params: true
  - path: /v1/knowledge/ingest
    target: http://orchestrator:8080/v1/knowledge/ingest
    auth: false
    methods:
    - POST
    headers: {}
    forward_headers: true
    merge_query_params: true
  - path: /v1/knowledge/search
    target: http://orchestrator:8080/v1/knowledge/search
    auth: false
    methods:
    - POST
    headers: {}
    forward_headers: true
    merge_query_params: true
  - path: /console
    target: http://orchestrator:8080/console
    auth: false
    methods:
    - GET
    headers: {}
  - path: /console/
    target: http://orchestrator:8080/console/
    auth: false
    methods:
    - GET
    headers: {}
  - path: /specialized/status
    target: http://orchestrator:8080/status
    auth: false
    methods: [GET]
    headers: {}
  - path: /specialized/docs
    target: http://orchestrator:8080/docs
    auth: false
    methods: [GET]
    headers: {}
  - path: /specialized/openapi.json
    target: http://orchestrator:8080/openapi.json
    auth: false
