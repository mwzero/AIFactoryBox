<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="120">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
  </defs>
  
  <!-- Icon: Isomorphic Box with Gateway Lines -->
  <g transform="translate(10, 10)">
    <!-- Top Face -->
    <polygon points="50,10 90,30 50,50 10,30" fill="#60A5FA" opacity="0.9"/>
    <!-- Left Face -->
    <polygon points="10,30 50,50 50,95 10,75" fill="url(#boxGrad)"/>
    <!-- Right Face -->
    <polygon points="50,50 90,30 90,75 50,95" fill="#1E40AF"/>
    
    <!-- Gateway Central Spark/Node -->
    <circle cx="50" cy="50" r="6" fill="#FFFFFF"/>
    <line x1="50" y1="50" x2="50" y2="20" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="50" y1="50" x2="75" y2="62" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="50" y1="50" x2="25" y2="62" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    
    <circle cx="50" cy="20" r="3.5" fill="#93C5FD"/>
    <circle cx="75" cy="62" r="3.5" fill="#93C5FD"/>
    <circle cx="25" cy="62" r="3.5" fill="#93C5FD"/>
  </g>

  <!-- Typography -->
  <text x="120" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" fill="#0F172A" letter-spacing="-0.5">
    AI<tspan fill="#3B82F6">Factory</tspan><tspan fill="#64748B" font-weight="400">Box</tspan>
  </text>
  <text x="122" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#94A3B8" letter-spacing="1.5">
    ENTERPRISE AI SERVICES GATEWAY
  </text>
</svg>
