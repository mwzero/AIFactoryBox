networks:
  ai-gateway-net:
    driver: bridge

volumes:
  litellm_data:
  openwebui_data:
  presidio_data:
  langfuse_postgres_data:

services:

  # ==========================================
  # 0. API ORCHESTRATOR SERVICE (FastAPI)
  # ==========================================
  orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    container_name: ai-gateway-orchestrator
    ports:
      - "8080:8080"
    environment:
      - DOCLING_URL=http://engine-doc-extraction:5000/process
      - PRESIDIO_ANALYZER_URL=http://pii-presidio-analyzer:3000/analyze
      - PRESIDIO_ANONYMIZER_URL=http://pii-presidio-anonymizer:3000/anonymize
      - WHISPER_URL=http://engine-speech-transcribe:8000/v1/audio/transcriptions
      - TEI_URL=http://engine-vector-embeddings:80/embed
      - RERANK_URL=http://engine-rerank:80/rerank
      - TTS_URL=http://engine-tts:5500/api/tts
      - GUARDRAIL_URL=http://pii-guardrails:8000/v1/security/guardrail
    networks:
      - ai-gateway-net
    depends_on:
      - docling-service
      - presidio-analyzer
      - presidio-anonymizer
      - faster-whisper
      - tei-embeddings
      - tei-rerank
      - piper-tts
      - llama-guard
    restart: unless-stopped

  # ==========================================
  # 1. FRONTEND & PLAYGROUND
  # ==========================================
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: ai-playground-ui
    ports:
      - "3000:8080"
    environment:
      - OPENAI_API_BASE_URL=http://litellm-proxy:4000/v1
      - OPENAI_API_KEY=sk-enterprise-gateway-key
    volumes:
      - openwebui_data:/app/backend/data
    networks:
      - ai-gateway-net
    restart: unless-stopped

  # ==========================================
  # 2. CORE GATEWAY & ROUTER (LiteLLM)
  # ==========================================
  litellm-proxy:
    image: ghcr.io/berriai/litellm:main-v1.35.0
    container_name: ai-gateway-core
    ports:
      - "4000:4000"
    environment:
      - LITELLM_MASTER_KEY=sk-master-key-change-me
      - DATABASE_URL=postgresql://litellm:litellm_pass@postgres-audit:5432/litellm_db
    volumes:
      - ./config/litellm-config.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    networks:
      - ai-gateway-net
    depends_on:
      - postgres-audit
    restart: unless-stopped

  # ==========================================
  # 3. PRIVACY & PII MASKING / GUARDRAILS MIDDLEWARE
  # ==========================================
  presidio-analyzer:
    image: mcr.microsoft.com/presidio-analyzer:latest
    container_name: pii-presidio-analyzer
    ports:
      - "5001:3000"
    networks:
      - ai-gateway-net
    restart: unless-stopped

  presidio-anonymizer:
    image: mcr.microsoft.com/presidio-anonymizer:latest
    container_name: pii-presidio-anonymizer
    ports:
      - "5002:3000"
    networks:
      - ai-gateway-net
    restart: unless-stopped

  # AI Content Guardrails & Moderation (/v1/security/guardrail)
  llama-guard:
    image: vllm/vllm-openai:latest
    container_name: pii-guardrails
    ports:
      - "5004:8000"
    command: ["--model", "meta-llama/Llama-Guard-3-8B"]
    networks:
      - ai-gateway-net
    restart: unless-stopped

  # ==========================================
  # 4. PRIMITIVE ENGINES
  # ==========================================

  # A. Document Extraction Engine (/v1/document/to-markdown & /v1/document/extract-tables)
  docling-service:
    image: quay.io/ds4sd/docling-serve:latest
    container_name: engine-doc-extraction
    ports:
      - "5003:5000"
    environment:
      - OMP_NUM_THREADS=4
    networks:
      - ai-gateway-net
    restart: unless-stopped

  # B. Speech & Audio Engine (/v1/audio/transcribe)
  faster-whisper:
    image: fedirz/faster-whisper-server:latest-cpu
    container_name: engine-speech-transcribe
    ports:
      - "8000:8000"
    environment:
      - WHISPER_MODEL=small
    networks:
      - ai-gateway-net
    restart: unless-stopped

  # C. Text-to-Speech Engine (/v1/audio/synthesize)
  piper-tts:
    image: rhasspy/piper-tts:latest
    container_name: engine-tts
    ports:
      - "5500:5500"
    networks:
      - ai-gateway-net
    restart: unless-stopped

  # D. Vector & Embeddings Engine (/v1/embeddings/generate)
  tei-embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
    container_name: engine-vector-embeddings
    ports:
      - "8001:80"
    command: ["--model-id", "BAAI/bge-small-en-v1.5"]
    networks:
      - ai-gateway-net
    restart: unless-stopped

  # E. Re-Ranking Engine (/v1/rerank)
  tei-rerank:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
    container_name: engine-rerank
    ports:
      - "8002:80"
    command: ["--model-id", "BAAI/bge-reranker-large"]
    networks:
      - ai-gateway-net
    restart: unless-stopped

  # F. Vision & OCR Engine (/v1/vision/ocr & /v1/vision/describe)
  paddle-ocr:
    image: paddlepaddle/paddleocr:latest-cpu
    container_name: engine-vision-ocr
    ports:
      - "8003:8080"
    networks:
      - ai-gateway-net
    restart: unless-stopped

  # ==========================================
  # 5. CONTROL PLANE & OBSERVABILITY
  # ==========================================
  postgres-audit:
    image: postgres:15-alpine
    container_name: controlplane-db
    environment:
      - POSTGRES_USER=litellm
      - POSTGRES_PASSWORD=litellm_pass
      - POSTGRES_DB=litellm_db
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    networks:
      - ai-gateway-net
    restart: unless-stopped

  # Documentazione API Interattiva (Scalar UI)
  scalar-docs:
    image: scalarapi/scalar:latest
    container_name: gateway-docs-scalar
    ports:
      - "7000:8080"
    environment:
      - SCALAR_SPEC_URL=http://orchestrator:8080/openapi.json
    networks:
      - ai-gateway-net
    depends_on:
      - orchestrator
    restart: unless-stopped
