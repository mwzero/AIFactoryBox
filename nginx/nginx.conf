events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    client_max_body_size 100M;

    upstream webui_backend {
        server open-webui:8080;
    }

    upstream litellm_backend {
        server litellm-proxy:4000;
    }

    server {
        listen 80;
        server_name localhost;

        # -------------------------------------------------------------
        # 1. API PRIMITIVE (FastAPI Orchestrator) + CORS
        # -------------------------------------------------------------
        # Standard model APIs go through LiteLLM (auth, quotas, PII).
        location /v1/ {
            proxy_pass http://litellm_backend;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 180s;
        }

        # Native LiteLLM reranking endpoint.
        location = /rerank {
            proxy_pass http://litellm_backend;
            proxy_set_header Authorization $http_authorization;
        }

        # Community pass-through routes require ingress authentication.
        # Ask LiteLLM to validate the bearer key without forwarding request bodies.
        location = /_litellm_auth {
            internal;
            proxy_pass http://litellm_backend/v1/models;
            proxy_method GET;
            proxy_intercept_errors on;
            error_page 400 =401 /_litellm_auth_denied;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
        }

        location = /_litellm_auth_denied {
            internal;
            return 401;
        }

        location ~ ^/v1/(document/|privacy/|audio/(transcribe|synthesize)$|vision/ocr$) {
            auth_request /_litellm_auth;
            proxy_pass http://litellm_backend;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_read_timeout 180s;
        }

        location /specialized/ {
            auth_request /_litellm_auth;
            proxy_pass http://litellm_backend;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $host;
        }

        location = /health {
            proxy_pass http://litellm_backend/health/liveliness;
        }

        # Preserve the documentation URLs, now owned by the model gateway.
        location = /docs {
            proxy_pass http://litellm_backend/docs;
            proxy_set_header Host $host;
        }

        location = /openapi.json {
            proxy_pass http://litellm_backend/openapi.json;
            proxy_set_header Host $host;
        }

        # -------------------------------------------------------------
        # 3. LiteLLM Proxy Admin UI (/admin/)
        # -------------------------------------------------------------
        location /admin/ {
            proxy_pass http://litellm_backend/ui/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -------------------------------------------------------------
        # 4. Open WebUI Playground (Root /) con WebSocket
        # -------------------------------------------------------------
        location / {
            proxy_pass http://webui_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}